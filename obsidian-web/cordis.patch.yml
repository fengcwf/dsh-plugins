# obsidian-web 配置注入
# 挂载本插件（⚠️ 此 insert 行是插件 apply 的入口——删除则插件不加载）
# ⚠️ config 是整行替换语义（非深度合并）：profile 覆盖者必须在此基础上重述全部键。
- insert:
    - id: obsidian-web
      name: 'obsidian-web'
      config:
        # vault 根路径：所有读写/下载/分享/目录维护的文件系统根（T12 起 realpath 围栏拒穿越/symlink）
        vaultRoot: '/mnt/unraid_data/Obsidian'
        # 分享模型（PRODUCT OW-INV-1）：逐条显式生成、默认不对外；写权限强制访问密码
        share:
          enabled: true
          # 分享链接默认有效期（天）
          defaultTtlDays: 7
          # 写权限强制访问密码（生成后可改；角色分级见 T8）
          requirePasswordForWrite: true
        # UI 面（T2/T13）：树/列表分页大小
        ui:
          pageSize: 50
        # 分享服务（T9 接）：唯一独立入口，可单独关停（OW-INV-10）
        server:
          sharePort: 3500
