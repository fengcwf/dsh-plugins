# obsidian-web 配置注入
# 挂载本插件（⚠️ 此 insert 行是插件 apply 的入口——删除则插件不加载）
# ⚠️ config 是整行替换语义（非深度合并）：profile 覆盖者必须在此基础上重述全部键。
- insert:
    - id: obsidian-web
      name: 'obsidian-web'
      config:
        # vault 根路径：所有读写/下载/分享/目录维护的文件系统根（T12 起 realpath 围栏拒穿越/symlink）
        vaultRoot: '/mnt/unraid_data/Obsidian'
        # 索引库基目录（0.1.1 迁出 CIFS 落本地盘）：每 vault 一库 <indexDir>/<vault 名-哈希>/；
        # 空/缺省=出厂默认 ~/.dsh/cache/obsidian-web/（~ 按 os.homedir() 展开；索引=可重建缓存 ARC-2）
        indexDir: '~/.dsh/cache/obsidian-web'
        # 分享模型（PRODUCT OW-INV-1）：逐条显式生成、默认不对外；写权限强制访问密码
        share:
          enabled: true
          # 分享链接默认有效期（天）
          defaultTtlDays: 7
          # 写权限强制访问密码（生成后可改；角色分级见 T8）
          requirePasswordForWrite: true
        # UI 面（T2/T13）：树/列表分页大小
        ui:
          pageSize: 50
        # 分享服务（T9 接）：唯一独立入口，可单独关停（OW-INV-10）
        server:
          # 缺省=null 同域 prefix 形（零自有端口）；独立 listener 需显式配 number 端口
          sharePort: null
