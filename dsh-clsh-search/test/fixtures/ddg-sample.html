<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>test page — DuckDuckGo</title>
</head>
<body class="body--desktop">
  <div class="serp__wrapper">
    <div id="links" class="results">
      <div class="result results_links results_links_deep web-result">
        <div class="links_main links_deep result__body">
          <h2 class="result__title">
            <a rel="nofollow" class="result__a" href="https://example.com/page-one">Example <b>Page</b> One</a>
          </h2>
          <div class="result__extras">
            <span class="result__url">example.com › page-one</span>
          </div>
          <a class="result__snippet" href="https://example.com/page-one">Snippet text with &amp; entity and <b>bold</b> part.</a>
        </div>
      </div>
      <div class="result results_links web-result">
        <div class="links_main links_deep result__body">
          <h2 class="result__title">
            <a rel="nofollow" class="result__a" href="//duckduckgo.com/l/?uddg=https%3A%2F%2Fwww.wikipedia.org%2Fwiki%2FSearch&amp;rut=abc123def">Redirected Result — Wikipedia</a>
          </h2>
          <a class="result__snippet">Search engines overview and history from the free encyclopedia.</a>
        </div>
      </div>
      <div class="result results_links web-result">
        <div class="links_main result__body">
          <h2 class="result__title">
            <a rel="nofollow" class="result__a" href="https://no-snippet.example.org/">No snippet attached</a>
          </h2>
        </div>
      </div>
      <div class="result results_links promo-result">
        <div class="links_main">noise block without result__a anchor, must be skipped</div>
      </div>
    </div>
    <div class="feedback">Serch form and pagination live here.</div>
  </div>
</body>
</html>
